[project]
name = "if-pbm-open-demo"
version = "0.1.0"
description = "Reproducible open-source demo of the If-PBM Patient Blood Management monitoring method"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Thomas Boulier", email = "boulier.thomas@gmail.com" }]
keywords = ["patient-blood-management", "clinical-data-warehouse", "healthcare", "duckdb"]
dependencies = [
    "duckdb>=1.1",
    "pandas>=2.2",
    "numpy>=1.26",
    "streamlit>=1.40",
    "plotly>=5.24",
]

[project.scripts]
if-pbm-demo = "if_pbm_open_demo.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
    "mypy>=1.13",
    "pre-commit>=4.0",
    "pandas-stubs>=2.2",
]
docs = [
    "mkdocs-material>=9.5",
    "mkdocstrings[python]>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/if_pbm_open_demo"]
include = [
    "src/if_pbm_open_demo/**/*.csv",
    "src/if_pbm_open_demo/**/*.sql",
]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
strict = true
python_version = "3.12"
files = ["src"]

[[tool.mypy.overrides]]
module = ["plotly.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
