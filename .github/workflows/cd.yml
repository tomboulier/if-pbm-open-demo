name: CD

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v4
      - name: Build distribution
        run: uv build
      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v4
      - name: Deploy docs
        run: |
          uv sync --extra docs
          uv run mkdocs gh-deploy --force
